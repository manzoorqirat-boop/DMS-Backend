name: Generate migration

# Generates an EF Core migration and commits it to the repository.
#
# This exists because the schema has been evolving without migrations. It was originally
# created by EnsureCreated, which can only create a database that does not exist — it cannot
# alter one that does. Every entity change since has therefore needed either a rebuild or
# hand-written ALTER statements run against the live database.
#
# That is a real problem for a Part 11 system, not just an inconvenience: a schema change
# applied by hand leaves no record of what changed, when, or who applied it, and no way to
# reproduce the same database elsewhere. A migration is a versioned, reviewable, replayable
# artefact in the repository. This workflow produces one without needing a local .NET install.
#
# Run it manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      name:
        description: >-
          Migration name, PascalCase. Use InitialCreate for the first one, then something
          describing the change (AddSignaturePolicy, AddAnnexures).
        required: true
        default: InitialCreate
        type: string

permissions:
  # Needed to push the generated migration back. Nothing else is required — this workflow
  # never touches a database.
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-ef
        # Pinned to the EF Core version in Directory.Packages.props. A newer tool can generate
        # migrations the runtime packages cannot apply, which fails confusingly at deploy time
        # rather than here.
        run: dotnet tool install --global dotnet-ef --version 8.0.10

      - name: Restore
        run: dotnet restore

      - name: Generate the migration
        # No DATABASE_URL is set, deliberately. `migrations add` only reads the compiled model
        # and never opens a connection; DesignTimeDbContextFactory falls back to a placeholder
        # connection string for exactly this case. Supplying a real one here would let a
        # mistake reach the database from a workflow whose whole purpose is to write a file.
        run: |
          dotnet ef migrations add "${{ inputs.name }}" \
            --project src/Dms.Infrastructure \
            --startup-project src/Dms.Api \
            --output-dir Persistence/Migrations

      - name: Add the audit-immutability triggers to the migration
        # The append-only triggers on the audit and signature tables live in raw SQL, because
        # they are not something EF's model can express. They have to be applied by the same
        # migration that creates those tables, or a freshly migrated database would have an
        # audit trail that silently accepts UPDATE and DELETE — the one thing §11.10(e) asks it
        # not to do.
        #
        # Only the first migration creates those tables, so this only patches InitialCreate.
        run: |
          set -e
          MIGRATION=$(ls -t src/Dms.Infrastructure/Persistence/Migrations/*_${{ inputs.name }}.cs | head -1)
          echo "Patching $MIGRATION"

          if [ "${{ inputs.name }}" != "InitialCreate" ]; then
            echo "Not the initial migration; triggers already applied. Skipping."
            exit 0
          fi

          python3 - "$MIGRATION" <<'PY'
          import re, sys

          path = sys.argv[1]
          source = open(path).read()

          call = (
              '\n            // Append-only enforcement for the audit trail and signatures. Applied here rather\n'
              '            // than left to the application, because a guard that lives only in the app is one\n'
              '            // that a direct database connection walks straight past.\n'
              '            migrationBuilder.Sql(System.IO.File.ReadAllText(System.IO.Path.Combine(\n'
              '                System.AppContext.BaseDirectory, "Persistence", "Migrations", "AuditImmutability.sql")));\n'
          )

          # Inserted at the end of Up(), after every table it depends on exists.
          marker = "protected override void Up(MigrationBuilder migrationBuilder)"
          start = source.index(marker)
          depth = 0
          for i in range(source.index("{", start), len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      # Inserted before the closing brace, keeping that brace on its own
                      # correctly-indented line rather than leaving it flush against the
                      # inserted text.
                      source = source[:i] + call + "        " + source[i:]
                      break

          open(path, "w").write(source)
          print("Trigger SQL wired into Up().")
          PY

      - name: Show what was generated
        run: |
          ls -la src/Dms.Infrastructure/Persistence/Migrations/
          echo "---"
          grep -c "CreateTable" src/Dms.Infrastructure/Persistence/Migrations/*_${{ inputs.name }}.cs \
            || echo "no CreateTable calls — expected for a migration that only alters"

      - name: Verify it still builds
        # A migration that does not compile is worse than none: it breaks every subsequent
        # deploy, and the failure appears far from its cause.
        run: dotnet build --no-restore --configuration Release

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/Dms.Infrastructure/Persistence/Migrations/
          git diff --staged --quiet && echo "Nothing to commit — the model matches the last migration." && exit 0
          git commit -m "Add ${{ inputs.name }} migration"
          git push
