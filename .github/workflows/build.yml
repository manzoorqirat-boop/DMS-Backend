name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore

      # The solution builds with TreatWarningsAsErrors, so this is already strict; -warnaserror
      # keeps it that way if that property is ever relaxed in a project file.
      - run: dotnet build --no-restore -c Release -warnaserror

      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      # Package versions in Directory.Packages.props were pinned without NuGet access. This
      # surfaces stale or vulnerable ones rather than leaving them to be discovered later.
      - name: Check for outdated and vulnerable packages
        continue-on-error: true
        run: |
          dotnet list package --outdated
          dotnet list package --vulnerable --include-transitive
